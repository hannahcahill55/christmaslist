<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexa's Christmas List</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        overflow-x: hidden;

        /* Shimmering red background */
        background: linear-gradient(45deg, #c40000, #8b0000);
        background-size: 400% 400%;
        animation: shimmer 8s ease infinite;
    }

    @keyframes shimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .snowflake {
        position: fixed;
        top: -10px;
        color: white;
        font-size: 1em;
        user-select: none;
        pointer-events: none;
        z-index: 9999;
        animation-name: fall, twinkle;
        animation-iteration-count: infinite;
        animation-timing-function: linear, ease-in-out;
    }

    @keyframes fall {
        0% { transform: translateY(0) translateX(0); opacity: 1; }
        100% { transform: translateY(100vh) translateX(20px); opacity: 0; }
    }

    @keyframes twinkle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    /* Sticky Nav Bar */
    nav {
        position: sticky;
        top: 0;
        background: rgba(200,0,0,0.95);
        padding: 15px 0;
        display: flex;
        justify-content: center;
        gap: 20px;
        font-size: 1.2rem;
        z-index: 1000;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    nav a:hover {
        color: gold;
        text-decoration: underline;
    }

    .container {
        padding: 40px 20px;
        max-width: 600px;
        margin: 0 auto;
    }

    .profile {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid white;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 2.6rem;
        margin-bottom: 30px;
    }

    h2 {
        font-size: 1.8rem;
        margin-top: 30px;
        margin-bottom: 15px;
        text-decoration: underline;
    }

    ul {
        list-style: none;
        padding: 0;
        font-size: 1.3rem;
    }

    li {
        margin: 8px 0;
    }

    ul li a {
        color: white;
        text-decoration: none;
        transition: all 0.3s;
    }

    ul li a:hover {
        color: gold;
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        h1 { font-size: 2rem; }
        h2 { font-size: 1.5rem; }
        .profile { width: 120px; height: 120px; }
        nav { font-size: 1rem; }
    }
</style>
</head>
<body>

<!-- Sticky Nav Bar -->
<nav>
    <a href="index.html">Return to Homepage</a>
</nav>

<div class="container">
    <img src="alexa.jpeg" class="profile" alt="Alexa">
    <h1>Alexa's Christmas List ⭐</h1>

    <!-- Example categories — replace with Alexa’s real list -->
    
    <h2>Clothing & Accessories</h2>
    <ul>
        <li><a href="#" target="_blank">Example Clothing Item</a></li>
        <li><a href="#" target="_blank">Example Jacket</a></li>
    </ul>

    <h2>Beauty & Self Care</h2>
    <ul>
        <li><a href="#" target="_blank">Example Beauty Product</a></li>
        <li><a href="#" target="_blank">Example Perfume</a></li>
    </ul>

    <h2>Fun & Hobbies</h2>
    <ul>
        <li><a href="#" target="_blank">Example Hobby Item</a></li>
        <li><a href="#" target="_blank">Example Craft Kit</a></li>
    </ul>

</div>

<!-- Snowflakes -->
<script>
    const snowCount = 50;
    for (let i = 0; i < snowCount; i++) {
        const snow = document.createElement('div');
        snow.className = 'snowflake';
        snow.style.left = Math.random() * 100 + 'vw';
        snow.style.fontSize = (Math.random() * 10 + 10) + 'px';
        snow.style.animationDuration = (Math.random() * 5 + 5) + 's, 2s';
        snow.style.animationDelay = Math.random() * 10 + 's, 0s';
        snow.innerHTML = '❄';
        document.body.appendChild(snow);
    }
</script>

</body>
</html>

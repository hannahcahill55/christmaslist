<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayley's Christmas List</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;

            /* SHIMMERING CHRISTMAS BACKGROUND */
            background: linear-gradient(120deg, #c40000, #ff2a2a, #c40000);
            background-size: 300% 300%;
            animation: shimmer 8s infinite alternate ease-in-out;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* NAV BAR */
        nav {
            width: 100%;
            padding: 15px 0;
            background: rgba(0,0,0,0.25);
            position: sticky;
            top: 0;
            backdrop-filter: blur(4px);
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            margin: 0 15px;
        }

        .container {
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        ul {
            list-style: none;
            padding: 0;
            font-size: 1.4rem;
        }

        li {
            margin: 12px 0;
        }
    </style>

</head>
<body>

    <nav>
        <a href="index.html">⟵ Return to Homepage</a>
    </nav>

    <div class="container">
        <h1>Hayley's Christmas List 🎁</h1>

        <ul>
            <li>Example Item 1</li>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hayley's Christmas List</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(45deg, #c40000, #8b0000);
        background-size: 400% 400%;
        animation: shimmer 8s ease infinite;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }

    @keyframes shimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    nav {
        background: rgba(0, 0, 0, 0.4);
        padding: 15px;
        position: sticky;
        top: 0;
        font-size: 1.2rem;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .container {
        padding: 40px 20px;
    }

    .profile {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 20px;
        border: 4px solid white;
    }

    h1 {
        font-size: 2.6rem;
        margin-bottom: 20px;
    }

    li {
        list-style: none;
        margin: 10px 0;
        font-size: 1.3rem;
    }
</style>

</head>
<body>

<nav>
    <a href="index.html">← Return to Homepage</a>
</nav>

<div class="container">
    <img src="hayley.jpg" class="profile" alt="Hayley">
    <h1>Hayley's Christmas List 🎁</h1>

    <ul>
        <li>Example Item 1</li>
        <li>Example Item 2</li>
        <li>Example Item 3</li>
    </ul>
</div>

</body>
</html>

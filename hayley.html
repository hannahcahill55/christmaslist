<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayley's Christmas List</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* PRESENT BORDER AROUND THE PAGE */
        body {
            --present-size: 80px;
            border-image-source: url('https://i.imgur.com/8JqjY7w.png'); /* repeating presents border */
            border-image-slice: 30;
            border-image-repeat: round;
            border-style: solid;
            border-width: var(--present-size);
        }

        /* Wrapper keeps content inside border nicely */
        .wrapper {
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 30px;
        }

        .content ul {
            list-style: none;
            font-size: 1.4rem;
            padding: 0;
        }

        .content li {
            margin: 12px 0;
        }
    </style>

</head>
<body>

    <div class="wrapper">
        <h1>Hayley's Christmas List 🎁</h1>

        <div class="content">
            <ul>
                <li>Example Item 1</li>
                <li>Example Item 2</li>
                <li>Example Item 3</li>
            </ul>
        </div>
    </div>

</body>
</html>

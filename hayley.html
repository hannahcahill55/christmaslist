<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayley's Christmas List</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;

            /* SHIMMERING BACKGROUND */
            background: linear-gradient(120deg, #c40000, #ff2a2a, #c40000);
            background-size: 300% 300%;
            animation: shimmer 8s infinite alternate ease-in-out;

            /* 🎁 GIFT BORDER */
            border-image-source: url('https://i.imgur.com/8JqjY7w.png');
            border-image-slice: 30;
            border-image-repeat: round;
            border-style: solid;
            border-width: 80px;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        nav {
            padding: 15px;
            background: rgba(0,0,0,0.3);
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
        }

        .container {
            padding: 40px 20px;
        }

        .profile {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(255,255,255,0.7);
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.6rem;
        }

        ul {
            list-style: none;
            padding: 0;
            font-size: 1.4rem;
        }

        li { margin: 12px 0; }
    </style>
</head>
<body>

<nav>
    <a href="index.html">⟵ Return to Homepage</a>
</nav>

<div class="container">
    <img class="profile" src="hayley.jpeg" alt="Hayley">
    <h1>Hayley's Christmas List 🎁</h1>

    <ul>
        <li>Example Item 1</li>
        <li>Example Item 2</li>
        <li>Example Item 3</li>
    </ul>
</div>

</body>
</html>

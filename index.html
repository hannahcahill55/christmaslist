<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 Christmas Lists</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #c40000; /* Solid red */
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 0 10px;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 4px black;
        }

        nav {
            margin-top: 20px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        nav ul li a {
            color: white;
            font-size: 1.3rem;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 8px;
            transition: background 0.3s, transform 0.2s;
        }

        nav ul li a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<header>
    <h1>2025 Christmas Lists</h1>

    <nav>
        <ul>
            <li><a href="hayley.html">Hayley</a></li>
            <li><a href="hannah.html">Hannah</a></li>
            <li><a href="alexa.html">Alexa</a></li>
        </ul>
    </nav>
</header>

</body>
</html>

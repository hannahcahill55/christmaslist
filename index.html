<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 Christmas Lists</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #c40000;
            color: white;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        /* Decorative Christmas Border */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            border: 25px solid transparent;
            border-image: url('https://i.imgur.com/1nJ1F6C.png') 60 round;
            z-index: 9999;
        }

        header {
            padding-top: 30px;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 4px black;
            margin-bottom: 10px;
        }

        /* Nav Bar */
        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 40px;
        }

        nav ul li a {
            color: white;
            font-size: 1.3rem;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 10px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* Profile Section */
        .profiles {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .profile {
            text-align: center;
        }

        .profile img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            box-shadow: 0 0 10px black;
        }

        .profile p {
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Countdown */
        #countdown {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 40px;
            text-shadow: 2px 2px 4px black;
        }
    </style>
</head>
<body>

<header>
    <h1>2025 Christmas Lists</h1>

    <nav>
        <ul>
            <li><a href="hayley.html">🎁 Hayley</a></li>
            <li><a href="hannah.html">🎄 Hannah</a></li>
            <li><a href="alexa.html">⭐ Alexa</a></li>
        </ul>
    </nav>
</header>

<!-- Profile Pictures -->
<div class="profiles">
    <div class="profile">
        <img src="https://i.imgur.com/PE5hXKZ.jpeg" alt="Hayley">
        <p>Hayley</p>
    </div>

    <div class="profile">
        <img src="https://i.imgur.com/GsZ8rSZ.jpeg" alt="Hannah">
        <p>Hannah</p>
    </div>

    <div class="profile">
        <img src="https://i.imgur.com/Q2oYU2a.jpeg" alt="Alexa">
        <p>Alexa</p>
    </div>
</div>

<!-- Countdown -->
<div id="countdown"></div>

<script>
    function updateCountdown() {
        const christmas = new Date("December 25, 2025 00:00:00").getTime();
        const now = new Date().getTime();
        const diff = christmas - now;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("countdown").innerHTML =
            days + " Days • " +
            hours + " Hrs • " +
            minutes + " Min • " +
            seconds + " Sec<br>until Christmas 🎅🎄";

        if (diff < 0) {
            document.getElementById("countdown").innerHTML = "Merry Christmas!! 🎁🎄";
        }
    }

    setInterval(updateCountdown, 1000);
</script>

</body>
</html>

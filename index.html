<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025 Christmas List's</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #c40000;
        color: white;
        text-align: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    /* LIGHTS */
    .light {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: 0 0 8px rgba(255,255,255,0.8);
        animation: blink 2s infinite alternate;
    }

    @keyframes blink {
        0% { opacity: 0.3; filter: brightness(0.7); }
        50% { opacity: 1; filter: brightness(1.6); }
        100% { opacity: 0.4; filter: brightness(1); }
    }

    /* NAVIGATION */
    header {
        padding-top: 20px;
    }

    h1 {
        font-size: 2.7rem;
        text-shadow: 2px 2px 4px black;
        margin-bottom: 12px;
    }

    nav ul {
        list-style: none;
        padding: 0;
        margin: 10px 0 30px;
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
    }

    nav ul li a {
        color: white;
        font-size: 1.3rem;
        text-decoration: none;
        font-weight: bold;
        padding: 8px 14px;
        border-radius: 10px;
        transition: 0.3s;
    }

    nav ul li a:hover {
        background: rgba(255,255,255,0.2);
        transform: scale(1.1);
    }

    /* PROFILE SECTION */
    .profiles {
        display: flex;
        justify-content: center;
        gap: 35px;
        margin-top: 10px;
        flex-wrap: wrap;
    }

    .profile {
        text-align: center;
        transition: transform 0.25s, filter 0.25s;
    }

    .profile:hover {
        transform: scale(1.08);
        filter: brightness(1.2);
    }

    .profile img {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 4px solid white;
        object-fit: cover;
        box-shadow: 0 0 12px black;
        cursor: pointer;
    }

    .profile p {
        margin-top: 10px;
        font-size: 1.2rem;
        font-weight: bold;
    }

    /* COUNTDOWN */
    #countdown {
        font-size: 1.8rem;
        font-weight: bold;
        margin-top: 35px;
        text-shadow: 2px 2px 4px black;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 600px) {
        h1 { font-size: 2rem; }
        nav ul { gap: 18px; }
        .profile img { width: 95px; height: 95px; }
        #countdown { font-size: 1.3rem; padding: 0 10px; }
    }
</style>
</head>

<body>

<header>
    <h1>2025 Christmas List's</h1>
    <nav>
        <ul>
            <li><a href="hayley.html">🎁 Hayley</a></li>
            <li><a href="hannah.html">🎄 Hannah</a></li>
            <li><a href="alexa.html">⭐ Alexa</a></li>
        </ul>
    </nav>
</header>

<!-- CLICKABLE PROFILE PICTURES -->
<div class="profiles">
    <a href="hayley.html" class="profile">
        <img src="hayley.jpeg" alt="Hayley">
        <p>Hayley</p>
    </a>

    <a href="hannah.html" class="profile">
        <img src="https://i.imgur.com/GsZ8rSZ.jpeg" alt="Hannah">
        <p>Hannah</p>
    </a>

    <a href="alexa.html" class="profile">
        <img src="https://i.imgur.com/Q2oYU2a.jpeg" alt="Alexa">
        <p>Alexa</p>
    </a>
</div>

<!-- COUNTDOWN -->
<div id="countdown"></div>

<!-- CHRISTMAS LIGHTS SCRIPT -->
<script>
    const colors = ["#FF0000","#FFFF00","#00FF00","#00FFFF","#FF00FF","#FFA500"];
    const numLightsPerSide = 25;
    const lights = [];

    function createLight(x, y, color) {
        const light = document.createElement("div");
        light.className = "light";
        light.style.backgroundColor = color;
        light.style.left = x + "px";
        light.style.top = y + "px";
        light.style.animationDuration = (1 + Math.random()*2) + "s";
        document.body.appendChild(light);
        lights.push(light);
    }

    function initLights() {
        const width = window.innerWidth;
        const height = window.innerHeight;

        // top
        for(let i=0;i<numLightsPerSide;i++){
            const x = i * (width / numLightsPerSide);
            createLight(x, 0, colors[Math.floor(Math.random()*colors.length)]);
        }
        // bottom
        for(let i=0;i<numLightsPerSide;i++){
            const x = i * (width / numLightsPerSide);
            createLight(x, height-12, colors[Math.floor(Math.random()*colors.length)]);
        }
        // left
        for(let i=0;i<numLightsPerSide;i++){
            const y = i * (height / numLightsPerSide);
            createLight(0, y, colors[Math.floor(Math.random()*colors.length)]);
        }
        // right
        for(let i=0;i<numLightsPerSide;i++){
            const y = i * (height / numLightsPerSide);
            createLight(width-12, y, colors[Math.floor(Math.random()*colors.length)]);
        }
    }

    window.addEventListener("resize", ()=>{
        lights.forEach(l=>l.remove());
        lights.length = 0;
        initLights();
    });

    initLights();

    // Countdown
    function updateCountdown() {
        const christmas = new Date("December 25, 2025 00:00:00").getTime();
        const now = new Date().getTime();
        const diff = christmas - now;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("countdown").innerHTML =
            days + " Days • " +
            hours + " Hrs • " +
            minutes + " Min • " +
            seconds + " Sec<br>until Christmas 🎅🎄";

        if(diff < 0){
            document.getElementById("countdown").innerHTML = "Merry Christmas!! 🎁🎄";
        }
    }

    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
